services:
  - type: web
    name: skillup-tracker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn skillup_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillup-db
          property: connectionString

databases:
  - name: skillup-db
    plan: free
